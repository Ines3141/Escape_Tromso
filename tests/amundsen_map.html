<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nansen Diary</title>


    <!-- Existing project CSS -->
    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/arctic-theme.css">


    <!-- Diary CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./amundsen_map.css">


    <script>
        const previousPage = "../stations/station_2_2.html";
        const nextPage = "station_2_4.html";
    </script>

    <!-- Nansen diary page turning logic -->
    <script src="./amundsen_map.js" defer></script>

    <style>
        /* give the old map a yellow-brownish, aged look */
        .old-map {
            filter: sepia(0.6) hue-rotate(15deg) saturate(1.2) brightness(0.95) contrast(1.05);
            /* optional subtle vignette effect via drop-shadow for depth */
            /* box-shadow: inset 0 0 120px rgba(0,0,0,0.15); */
        }
    </style>

</head>

<body>


    <div class="box">
        <h1>Amundsen's Expeditions</h1>


        <div class="map-viewer">

            <!-- Main map -->
            <div class="map active" id="worldMap">

                <img src="worldmap.jpg">

                <button class="pin" data-map="gjoaMap" style="left:20%; top:25%">📍</button>

                <button class="pin" data-map="framMap" style="left:48%; top:32%">📍</button>

                <button class="pin" data-map="maudMap" style="left:66%; top:56%">📍</button>

            </div>


            <!-- Northwest Passage -->
            <div class="map detail-map" id="gjoaMap">

                <img src="northwest-passage-large.jpg">

                <div class="map-note">
                    <h2>1903–1906</h2>
                    <p>
                        Goal: Navigate the Northwest Passage
                    </p>
                    <p>
                        Vessel: Gjøa
                    </p>
                </div>

                <button class="back-btn">
                    ← Back
                </button>

            </div>

        </div>
</body>

</html>
