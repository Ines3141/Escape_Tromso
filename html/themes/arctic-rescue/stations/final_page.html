<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Rescue Decision</title>

    <link rel="stylesheet" href="../../../../CSS/global.css">
    <link rel="stylesheet" href="../../../../CSS/final_page.css">
    <link rel="stylesheet" href="../../../../CSS/station.css">
    <style>
        .final-page {
            background: radial-gradient(circle at top, #123b63, #03101f 70%);
        }

        .final-box {
            max-width: 650px;
            border: 1px solid rgba(125, 211, 252, 0.35);
            box-shadow: 0 0 35px rgba(80, 180, 255, 0.25);
        }

        .signal-badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(0, 184, 148, 0.18);
            border: 1px solid #00b894;
            color: #7fffe0;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .progress-wrap {
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            margin: 22px 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00b894, #7dd3fc);
            transition: width 0.4s;
        }

        .rescue-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(125, 211, 252, 0.35);
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .rescue-card span {
                font-weight: bold;
            }

            .rescue-card small {
                color: #f7d046;
            }

            .rescue-card.locked {
                border-color: #00b894;
                box-shadow: 0 0 16px rgba(0, 184, 148, 0.25);
            }

                .rescue-card.locked small {
                    color: #7fffe0;
                }

        .choice-menu {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

            .choice-menu button {
                width: 100%;
                margin: 8px 0;
            }

                .choice-menu button.selected {
                    background: #00b894;
                    color: white;
                }

       
        .send-button {
            width: 100%;
            margin-top: 18px;
            background: linear-gradient(135deg, #00b894, #0984e3);
            color: white;
            box-shadow: 0 0 24px rgba(0, 184, 148, 0.35);
        }

        #feedback {
            margin-top: 18px;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
    <script src="../../../Stations/JAVA/navigation.js"></script>
    <script>
        const previousPage = "station_7_0.html";
        const nextPage = "congrats.html";
    </script>
</head>
<body class="final-page">

    <div class="box final-box">

        <div class="signal-badge">FINAL TRANSMISSION</div>

        <h1>Rescue Control Panel</h1>

        <p>
            Enter the four final pieces of information.
            When everything is locked, send the rescue plan to the crew.
        </p>

        <div class="progress-wrap">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <button class="rescue-card" onclick="toggleMenu(this)" data-category="route">
            <span>🧭 Route through the ice</span>
            <small id="status-route">Not selected</small>
        </button>

        <div class="choice-menu hidden">
            <div class="route-grid">
                <button onclick="choose('route','wrong', this)"> Arctic</button>
                <button onclick="choose('route','correct', this)">Sleigh</button>
                <button onclick="choose('route','wrong', this)">Nansen</button>
            </div>
        </div>

        <button class="rescue-card" onclick="toggleMenu(this)" data-category="frequency">
            <span>📻 Radio frequency</span>
            <small id="status-frequency">Not selected</small>
        </button>

        <div class="choice-menu hidden">
            <button onclick="choose('frequency','wrong', this)">222 GHz</button>
            <button onclick="choose('frequency','correct', this)">111 GHz</button>
            <button onclick="choose('frequency','wrong', this)">333 GHz</button>
        </div>

        <button class="rescue-card" onclick="toggleMenu(this)" data-category="coords">
            <span>📍 Safety depot coordinates</span>
            <small id="status-coords">Not selected</small>
        </button>

        <div class="choice-menu hidden">
            <button onclick="choose('coords','wrong', this)">69.64N, 18.95E</button>
            <button onclick="choose('coords','correct', this)">78.13N, 15.38E</button>
            <button onclick="choose('coords','wrong', this)">90.00N, 0.00E</button>
        </div>

        <button class="rescue-card" onclick="toggleMenu(this)" data-category="date">
            <span>📅 Date to leave</span>
            <small id="status-date">Not selected</small>
        </button>

        <div class="choice-menu hidden">
            <button onclick="choose('date','correct', this)">2 June</button>
            <button onclick="choose('date','wrong', this)">9 June</button>
            <button onclick="choose('date','wrong', this)">3 July</button>
        </div>

        <button class="send-button" onclick="checkFinal()">
            📡 Send Rescue Transmission
        </button>

        <button class="back-button" onclick="window.location.href = previousPage">
            Back
        </button>

        <p id="feedback"></p>
        <button onclick="window.location.href = nextPage">DEV Continue</button>
    </div>

    <script>
        const answers = {route: null, frequency: null, coords: null, date: null};
        function toggleMenu(button) {
            const menu = button.nextElementSibling;
            const isOpen = !menu.classList.contains("hidden");
            closeAllMenus();
            if (!isOpen) {
                menu.classList.remove("hidden");
            }
        }
        function closeAllMenus() {
            document.querySelectorAll(".choice-menu").forEach(menu => {
                menu.classList.add("hidden");
            });
        }
        function choose(category, value, button) {
            answers[category] = value;

            const menu = button.closest(".choice-menu");

            menu.querySelectorAll("button").forEach(btn => {
                btn.classList.remove("selected");
            });

            button.classList.add("selected");

            lockCard(category);
            updateProgress();
        }

        function lockCard(category) {
            const card = document.querySelector(`[data-category="${category}"]`);
            const status = document.getElementById(`status-${category}`);

            card.classList.add("locked");
            status.textContent = "Locked";
        }

        function updateProgress() {
            const filled = Object.values(answers).filter(value => value !== null).length;
            document.getElementById("progressBar").style.width = `${filled * 25}%`;
        }

        document.addEventListener("click", function (event) {
            const clickedMenu = event.target.closest(".choice-menu");
            const clickedCard = event.target.closest(".rescue-card");

            if (!clickedMenu && !clickedCard) {
                closeAllMenus();
            }
        });

        function checkFinal() {
            const feedback = document.getElementById("feedback");

            const allFilled = Object.values(answers).every(value => value !== null);

            if (!allFilled) {
                feedback.textContent = "⚠️ Transmission incomplete. Lock all four values first.";
                feedback.style.color = "#f7d046";
                return;
            }

            const allCorrect =
                answers.route === "correct" &&
                answers.frequency === "correct" &&
                answers.coords === "correct" &&
                answers.date === "correct";

            if (allCorrect) {
                feedback.textContent = "📡 Transmission accepted. Rescue plan sent.";
                feedback.style.color = "lightgreen";

                setTimeout(() => {
                    window.location.href = nextPage;
                }, 1200);
            } else {
                feedback.textContent = "⚠️ Transmission rejected. One or more values are wrong.";
                feedback.style.color = "orange";
            }
        }
    </script>
    <game-navigation></game-navigation>

    <script>
        setupGameNavigation();
    </script>
</body>

</html>
