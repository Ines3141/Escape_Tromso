<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Station 1</title>
    <link rel="stylesheet" href="../../../../CSS/global.css">
    <link rel="stylesheet" href="../../../../CSS/station.css">
    <link rel="stylesheet" href="../../../../CSS/attachments.css">
    <script src="../../../../Stations/JAVA/letter_templates.js"></script>
    <script src="../../../../Stations/JAVA/incoming_dispatch.js"></script>
    <script src="../../../../Stations/JAVA/attachments.js"></script>
    <script src="../../../../Stations/JAVA/story_data.js"></script>
    <script src="../../../../Stations/JAVA/story_chat.js"></script>
    <script src="../../../../Stations/JAVA/navigation.js"></script>
    <script src="../../../../Stations/JAVA/inventory.js"></script>
    <script>
        const chatPass = new URLSearchParams(window.location.search).get("pass") || "start";

        const chatNavigation = {
            start: {
                previous: "../riddle/riddle_1_2_destination.html",
                next: "../riddle/riddle_2_1_phone.html"
            }
        };

        const currentNavigation = chatNavigation[chatPass] || chatNavigation.start;

        const previousPage = currentNavigation.previous;
        const nextPage = currentNavigation.next;
    </script>
    <style>
        story-chat {
            display: block;
            width: fit-content;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Station 1</h1>
        <p>Gateway to the Arctic</p>

        <story-chat story="nansen_dispatch"></story-chat>
        <button id="profile" class="profile-button" onclick="openProfile()" style="display:none;">
            Explorer Gateway to arctic
        </button>
        <button class="riddle-button" id="riddle_btn" onclick="window.location.href=nextPage">
            Solve Riddle
        </button>
        <button onclick="clearInventory();"> Reset Inventory </button>
    </div>
    <game-navigation></game-navigation>
    <script>
        setupGameNavigation();
    </script>
</body>

</html>
