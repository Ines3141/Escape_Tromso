<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nansen Ice Route</title>

    <link rel="stylesheet" href="../../../../CSS/global.css">
    <link rel="stylesheet" href="../../../../CSS/arctic-theme.css">

    <!-- Defines the riddle and previous/next pages -->
    <script src="../../../../Stations/JAVA/riddle_nansen.js"
            defer>
    </script>

    <script src="../../../../Stations/JAVA/navigation.js"
            defer>
    </script>
</head>

<body class="nansen-riddle-page">
    <main class="box riddle-card">
        <header class="riddle-header">
            <span class="riddle-label">Nansen expedition</span>

            <h1>Find the route through the ice</h1>

            <p>
                Connect the markers in the correct order.
                Nansen's diary in your inventory will guide you.
            </p>
        </header>

        <section class="ice-game"
                 aria-label="Connect the correct number markers">
            <div class="ice-overlay"></div>

            <svg id="lineLayer"
                 aria-hidden="true"></svg>

            <!-- Correct route: 1 → 9 → 2 → 2 -->

            <button type="button"
                    class="number-dot"
                    data-number="S"
                    aria-label="Select number S"
                    style="left: 23%; top: 18%;">
                S
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="L"
                    aria-label="Select number L"
                    style="left: 32%; top: 36%;">
                L
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="E"
                    aria-label="Select first number E"
                    style="left: 72%; top: 52%;">
                E
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="I"
                    aria-label="Select second number I"
                    style="left: 84%; top: 76%;">
                I
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="G"
                    aria-label="Select number G"
                    style="left: 72%; top: 17%;">
                G
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="H"
                    aria-label="Select number H"
                    style="left: 10%; top: 62%;">
                H
            </button>

            <!-- Decoy markers -->

            <button type="button"
                    class="number-dot"
                    data-number="F"
                    aria-label="Select number F"
                    style="left: 48%; top: 85%;">
                F
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="T"
                    aria-label="Select number T"
                    style="left: 91%; top: 31%;">
                T
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="R"
                    aria-label="Select number R"
                    style="left: 12%; top: 87%;">
                R
            </button>
        </section>

        <div class="route-panel">
            <span class="route-label">Your route</span>
            <output id="selectedRoute" aria-live="polite">
                —
            </output>
        </div>

        <p id="feedback"
           class="riddle-feedback"
           role="status"
           aria-live="polite">
        </p>

        <div class="riddle-actions">
            <button type="button"
                    class="secondary-button"
                    id="undo_nansen"
                    disabled>
                Undo
            </button>

            <button type="button"
                    class="secondary-button"
                    id="reset_nansen"
                    disabled>
                Reset
            </button>

            <button type="button"
                    class="submit-button"
                    id="check_nansen">
                Check route
            </button>
        </div>

        <button type="button"
                class="submit-button continue-button"
                id="submit_nansen"
                hidden>
            Continue
        </button>
        <button onclick="window.location.href = nextPage">DEV Continue </button>
    </main>
    <game-navigation></game-navigation>
</body>
</html>
