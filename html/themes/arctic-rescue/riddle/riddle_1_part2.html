<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Right location? </title>
    <link rel="stylesheet" href="../../../../CSS/global.css"> <!-- link to style sheet -->
</head>
<body>
    <div class="box">
        <p>Which polar explorer do you see?</p>
        <input id="answer" type="text" placeholder="Answer: Last name">
        <submit-button onclick="checkAnswer()">Submit</submit-button>
        <p id="message"></p>
        <back-button onclick="window.location.href='riddle_1.html'">
            Back
        </back-button>
    </div>

    <script>
        function checkAnswer() {
            let answer = document.getElementById("answer").value.trim().toLowerCase();

            if (answer === "nansen") {
                window.location.href = "../stations/station_2.html";
            } else {
                window.location.href = "riddle_1.html";
            }
        }
    </script>

</body>
</html>
