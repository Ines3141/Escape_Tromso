<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Riddle Wanny Woldstad </title>
    <link rel="stylesheet" href="../../../../CSS/global.css"> <!-- link to style sheet -->
    <script src="../../../../Stations/JAVA/navigation.js"></script>
    <script>
        const previousPage = "../stations/station_3_2.html";
        const nextPage = "riddle_3_4_location.html";
    </script>
</head>
<body>
    <div class="box">
        <h1> Communication problem </h1>
        <p>Which animal will lead you to the right frequency?</p>
        <p> Wanny Woldstad's' field case in your inventory will help you. </p>
        <div class="image-container">
            <img src="../../../../assets/images/Labyrinth_Wanny_Animals.jpg" alt="Station 3">
        </div>
        <!-- CHANGE THAT THEY CAN PRESS DIRECTLY THE BUTTONS THERE -->
        <!-- -->
        <input id="answerInput" placeholder="Enter frequency">
        <button id="checkBtn">Transmit</button>
        <p id="feedback"></p>
        <!-- REMOVE LATER 
        <button onclick="window.location.href = nextPage">Continue (DEV)</button> -->
    </div>
    <script>
        checkBtn.addEventListener("click", () => {
            const answer = answerInput.value
                .toLowerCase()
                .replace(/\s+/g, "");
            if (
                answer === "111" ||
                answer === "111ghz"
            ) {
                window.location.href = nextPage;
            } else {
                feedback.textContent = "Wrong frequency. Try again.";
            }
        });
    </script>
    <game-navigation></game-navigation>
    <script>
        setupGameNavigation();
    </script>

</body>

</html>
