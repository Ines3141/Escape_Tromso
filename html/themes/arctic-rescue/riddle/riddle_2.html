<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Riddle Nansen </title>
    <!-- link to style sheet -->
    <link rel="stylesheet" href="../../../../CSS/global.css">
    <link rel="stylesheet" href="../../../../CSS/arctic-theme.css">
    <script src="../../../../Stations/JAVA/letter_templates.js"></script>
    <script src="../../../../Stations/JAVA/incoming_dispatch.js"></script>
    <script src="../../../../Stations/JAVA/navigation.js"></script>
</head>

<body>
    <div class="box">
        <p>
            Which path do you have to take through the ice?
            The year when Nansen got Nobel peace will help you.
        </p>
        <incoming-dispatch letter-id="nansen-ice-dispatch"
                           title="Incoming Dispatch"
                           from="Dispatch Control">
        </incoming-dispatch>
        <div class="ice-game">
            <svg id="lineLayer"></svg>
            <button class="number-dot" data-number="C" style="left:10%; top:10%;">C</button>
            <button class="number-dot" data-number="O" style="left:60%; top:15%;">O</button>
            <button class="number-dot" data-number="R" style="left:25%; top:30%;">R</button>
            <button class="number-dot" data-number="I" style="left:5%; top:60%;">I</button>
            <button class="number-dot" data-number="D" style="left:75%; top:70%;">D</button>
            <button class="number-dot" data-number="N" style="left:50%; top:72%;">N</button>
            <button class="number-dot" data-number="L" style="left:5%; top:88%;">L</button>
            <button class="number-dot" data-number="A" style="left:85%; top:88%;">O</button>
            <button class="number-dot" data-number="K" style="left:45%; top:25%;">K</button>
            <button class="number-dot" data-number="E" style="left:50%; top:72%;">E</button>
        </div>

        <p id="feedback"></p>
        <button class="submit-button" id="check_nansen">
            Check Answer
        </button>

        <button class="submit-button" id="submit_nansen" onclick="window.location.href='riddle_2_location.html'"
                style="display:none;">
            Continue
        </button>
        <button class="back-button" onclick="window.location.href='riddle_1.html'">
            Back
        </button>

        <script>
            const correctAnswer = ["C", "O", "L", "D"];
            let selected = [];

            const buttons = document.querySelectorAll(".number-dot");
            const svg = document.getElementById("lineLayer");
            const feedback = document.getElementById("feedback");
            const game = document.querySelector(".ice-game");
            const btn_submit = document.getElementById("submit_nansen");
            const btn_check = document.getElementById("check_nansen");

            buttons.forEach(button => {
                button.addEventListener("click", () => {
                    if (selected.includes(button)) return;

                    selected.push(button);
                    button.classList.add("selected");

                    feedback.textContent = "";
                    drawCurvedLines();
                });
            });

            btn_check.addEventListener("click", () => {
                checkAnswer();
            });

            function checkAnswer() {
                const currentAnswer = selected.map(btn => btn.dataset.number);

                if (JSON.stringify(currentAnswer) === JSON.stringify(correctAnswer)) {
                    feedback.textContent = "Correct! The path through the ice is revealed.";
                    feedback.style.color = "lightgreen";

                    btn_submit.style.display = "";
                    btn_check.style.display = "none";
                } else {
                    feedback.textContent = "Not quite. Try again.";
                    feedback.style.color = "orange";

                    setTimeout(resetGame, 1500);
                }
            }

            function drawCurvedLines() {
                svg.innerHTML = "";

                for (let i = 0; i < selected.length - 1; i++) {
                    const start = getCenter(selected[i]);
                    const end = getCenter(selected[i + 1]);

                    const midX = (start.x + end.x) / 2;
                    const midY = (start.y + end.y) / 2 - 40;

                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

                    path.setAttribute(
                        "d",
                        `M ${start.x} ${start.y} Q ${midX} ${midY} ${end.x} ${end.y}`
                    );

                    path.setAttribute("stroke", "white");
                    path.setAttribute("stroke-width", "4");
                    path.setAttribute("fill", "none");
                    path.setAttribute("stroke-linecap", "round");

                    svg.appendChild(path);
                }
            }

            function getCenter(element) {
                const gameRect = game.getBoundingClientRect();
                const rect = element.getBoundingClientRect();

                return {
                    x: rect.left + rect.width / 2 - gameRect.left,
                    y: rect.top + rect.height / 2 - gameRect.top
                };
            }

            function resetGame() {
                selected = [];
                svg.innerHTML = "";
                feedback.textContent = "";
                btn_submit.style.display = "none";
                btn_check.style.display = "";

                buttons.forEach(btn => btn.classList.remove("selected"));
            }
        </script>
    </div>
    <game-navigation previous="../stations/station_2.html" next="riddle_2_location.html">
    </game-navigation>
</body>

</html>
