<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nansen Ice Route</title>

    <link rel="stylesheet" href="../../../../CSS/global.css">
    <link rel="stylesheet" href="../../../../CSS/arctic-theme.css">

    <!-- Defines the riddle and previous/next pages -->
    <script src="../../../../Stations/JAVA/riddle_nansen.js"
            defer>
    </script>

    <script src="../../../../Stations/JAVA/navigation.js"
            defer>
    </script>
</head>

<body class="nansen-riddle-page">
    <main class="box riddle-card">
        <header class="riddle-header">
            <span class="riddle-label">Nansen expedition</span>

            <h1>Find the route through the ice</h1>

            <p>
                Connect the markers in the correct order.
                The year Nansen received the Nobel Peace Prize
                will guide you.
            </p>
        </header>

        <section class="ice-game"
                 aria-label="Connect the correct number markers">
            <div class="ice-overlay"></div>

            <svg id="lineLayer"
                 aria-hidden="true"></svg>

            <!-- Correct route: 1 → 9 → 2 → 2 -->

            <button type="button"
                    class="number-dot"
                    data-number="1"
                    aria-label="Select number 1"
                    style="left: 23%; top: 18%;">
                1
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="9"
                    aria-label="Select number 9"
                    style="left: 32%; top: 36%;">
                9
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="2"
                    aria-label="Select first number 2"
                    style="left: 72%; top: 52%;">
                2
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="2"
                    aria-label="Select second number 2"
                    style="left: 84%; top: 76%;">
                2
            </button>

            <!-- Decoy markers -->

            <button type="button"
                    class="number-dot"
                    data-number="8"
                    aria-label="Select number 8"
                    style="left: 72%; top: 17%;">
                8
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="4"
                    aria-label="Select number 4"
                    style="left: 10%; top: 62%;">
                4
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="0"
                    aria-label="Select number 0"
                    style="left: 48%; top: 85%;">
                0
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="7"
                    aria-label="Select number 7"
                    style="left: 91%; top: 31%;">
                7
            </button>

            <button type="button"
                    class="number-dot"
                    data-number="3"
                    aria-label="Select number 3"
                    style="left: 12%; top: 87%;">
                3
            </button>
        </section>

        <div class="route-panel">
            <span class="route-label">Your route</span>

            <output id="selectedRoute"
                    aria-live="polite">
                —
            </output>
        </div>

        <p id="feedback"
           class="riddle-feedback"
           role="status"
           aria-live="polite">
        </p>

        <div class="riddle-actions">
            <button type="button"
                    class="secondary-button"
                    id="undo_nansen"
                    disabled>
                Undo
            </button>

            <button type="button"
                    class="secondary-button"
                    id="reset_nansen"
                    disabled>
                Reset
            </button>

            <button type="button"
                    class="submit-button"
                    id="check_nansen">
                Check route
            </button>
        </div>

        <button type="button"
                class="submit-button continue-button"
                id="submit_nansen"
                hidden>
            Continue
        </button>
    </main>

    <game-navigation></game-navigation>
</body>
</html>
