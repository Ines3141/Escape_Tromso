<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Riddle 1</title>
    <link rel="stylesheet" href="../../../../CSS/global.css"> <!-- link to style sheet -->
    <script src="../../../../Stations/JAVA/letter_templates.js"></script>
    <script src="../../../../Stations/JAVA/incoming_dispatch.js"></script>
    <script src="../../../../Stations/JAVA/navigation.js"></script>
    <style>
        html,
        body {
            min-height: 100%;
            overflow-y: auto;
        }

        body {
            padding-bottom: 120px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Riddle 1</h1>
        <h2> Go 64m south and 129m west.</h2>
        <img src="../../../../assets/images/station_1_test.jpg" alt="Treasure Map" class="riddle-map">
        <button class="submit-button" onclick=window.location.href='riddle_1_part2.html'>
            Click here when you found the correct location.
        </button>

        <incoming-dispatch letter-id="station-1-signal" title="Incoming Dispatch" from="Dispatch Control"
            next="../stations/station_2.html" lamp="true">
        </incoming-dispatch>
        <p id="message"></p>
        <button class="back-button" onclick="window.location.href='../stations/station_1.html'">
            Back
        </button>
    </div>
    <game-navigation previous="..\stations\station_1.html" next="riddle_1_part2.html">
    </game-navigation>
</body>

</html>
