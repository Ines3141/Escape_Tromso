<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <title>Station 5</title>

    <link rel="stylesheet" href="../../../../CSS/global.css">
    <link rel="stylesheet" href="../../../../CSS/station.css">
    <link rel="stylesheet" href="../../../../CSS/nansen.css">

    <script src="../../../../Stations/JAVA/navigation.js"></script>
    <script src="../../../../Stations/JAVA/inventory.js"></script>

    <script>
        const previousPage = "../riddle/riddle_4_3_location.html";
        const nextPage = "../riddle/riddle_5_2_compass.html";
    </script>
</head>

<body>
    <!-- Incoming call -->
    <div id="callScreen" class="call-screen">
        <div class="call-card">
            <div class="caller-photo">
                <img src="../../../../assets/images/Amundsen.jpg"
                     alt="Roald Amundsen">
            </div>

            <p id="incomingText" class="incoming-text">
                Incoming call...
            </p>

            <h1>Roald Amundsen</h1>
            <p class="call-subtitle">Arctic Explorer</p>
            <div id="callActions"
                 class="call-actions controls-hidden">
                <button class="call-button decline-call"
                        id="declineCallButton"
                        type="button"
                        aria-label="Decline call">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6.6 10.8c1.5 3 3.9 5.4 6.9 6.9l2.3-2.3c.3-.3.7-.4 1.1-.2
                     1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1
                     C11 21 3 13 3 3c0-.6.4-1 1-1h3.2c.6 0 1 .4 1 1
                     0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z">
                        </path>
                    </svg>
                </button>

                <button class="call-button accept-call"
                        id="acceptCallButton"
                        type="button"
                        aria-label="Accept call">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6.6 10.8c1.5 3 3.9 5.4 6.9 6.9l2.3-2.3c.3-.3.7-.4 1.1-.2
                     1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1
                     C11 21 3 13 3 3c0-.6.4-1 1-1h3.2c.6 0 1 .4 1 1
                     0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z">
                        </path>
                    </svg>
                </button>
            </div>
            <p id="callHelp" class="call-help">
                Tap anywhere on the screen
            </p>
        </div>
    </div>
    <audio id="ringtone" preload="auto" loop>
        <source src="../../../../assets/audio/Incoming_Call.m4a"
                type="audio/mp4">
    </audio>
    <!-- Station content -->
    <div id="stationContent"
         class="box nansen-call"
         style="display: none;">
        <h1>Station 5</h1>
        <p>Roald Amundsen</p>

        <div class="person-container">
            <img src="../../../../assets/images/Amundsen.jpg"
                 alt="Roald Amundsen"
                 class="imag-person">
        </div>

        <div class="audio-row">
            <div id="subtitle"
                 class="subtitle"
                 aria-live="polite"></div>
        </div>

        <!-- Audio 1 -->
        <audio id="voice1" preload="auto">
            <source src="../../../../assets/audio/Amundsen/Amundsen_1.m4a"
                    type="audio/mp4">
        </audio>

        <!-- Audio 2 -->
        <audio id="voice2" preload="auto">
            <source src="../../../../assets/audio/Amundsen/Amundsen_2.m4a"
                    type="audio/mp4">
        </audio>

        <!-- Audio 2 B -->
        <audio id="voice3" preload="auto">
            <source src="../../../../assets/audio/Amundsen/Amundsen_2_B.m4a"
                    type="audio/mp4">
        </audio>

        <!-- Audio 2 C -->
        <audio id="voice4" preload="auto">
            <source src="../../../../assets/audio/Amundsen/Amundsen_2_C.m4a"
                    type="audio/mp4">
        </audio>

        <!-- Common audio after D or E -->
        <audio id="voice5" preload="auto">
            <source src="../../../../assets/audio/Amundsen/Amundsen_3.m4a"
                    type="audio/mp4">
        </audio>

        <!-- Audio 3 D -->
        <audio id="voice6" preload="auto">
            <source src="../../../../assets/audio/Amundsen/Amundsen_3_D.m4a"
                    type="audio/mp4">
        </audio>

        <!-- Audio 3 E -->
        <audio id="voice7" preload="auto">
            <source src="../../../../assets/audio/Amundsen/Amundsen_3_E.m4a"
                    type="audio/mp4">
        </audio>

        <div id="choices" style="display: none;">
            <button id="btnA"
                    class="answer-button"
                    type="button"></button>

            <button id="btnB"
                    class="answer-button"
                    type="button"></button>

            <button id="btnC"
                    class="answer-button"
                    type="button"></button>

            <button id="btnD"
                    class="answer-button"
                    type="button"></button>

            <button id="btnE"
                    class="answer-button"
                    type="button"></button>
        </div>

        <div class="call-toolbar-wrapper">
            <!-- Reaction menu -->
            <div id="reactionMenu"
                 class="reaction-menu hidden"
                 role="menu"
                 aria-label="Send a reaction">
                <button class="reaction-option"
                        type="button"
                        data-reaction="❤️"
                        aria-label="Send heart reaction">
                    ❤️
                </button>

                <button class="reaction-option"
                        type="button"
                        data-reaction="👍"
                        aria-label="Send thumbs-up reaction">
                    👍
                </button>

                <button class="reaction-option"
                        type="button"
                        data-reaction="🥱"
                        aria-label="Send yawning reaction">
                    🥱
                </button>
            </div>

            <!-- Three call buttons -->
            <div class="call-toolbar">
                <!-- Audio -->
                <button id="audioBtn"
                        class="call-control-button audio-control"
                        type="button"
                        aria-label="Play or pause audio">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
                        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                        <path d="M18 6a8.5 8.5 0 0 1 0 12"></path>
                    </svg>
                </button>

                <!-- Hang up -->
                <button id="hangUpButton"
                        class="call-control-button hangup-control"
                        type="button"
                        aria-label="Hang up">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                       19.79 19.79 0 0 1-8.63-3.07
                       19.5 19.5 0 0 1-6-6
                       19.79 19.79 0 0 1-3.07-8.63
                       A2 2 0 0 1 4.11 2h3
                       a2 2 0 0 1 2 1.72
                       c.13.96.36 1.9.68 2.8
                       a2 2 0 0 1-.45 2.11L8 9.91
                       a16 16 0 0 0 6 6l1.27-1.27
                       a2 2 0 0 1 2.11-.45
                       c.9.32 1.84.55 2.8.68
                       A2 2 0 0 1 22 16.92Z"></path>
                    </svg>
                </button>

                <!-- More/reactions -->
                <button id="moreButton"
                        class="call-control-button more-control"
                        type="button"
                        aria-label="Open reactions"
                        aria-expanded="false"
                        aria-controls="reactionMenu">
                    <span class="more-dots">•••</span>
                </button>
            </div>
        </div>
        <button class="riddle-button"
                id="riddle_btn"
                type="button"
                style="display: none;"
                onclick="window.location.href = nextPage">
            Solve Riddle
        </button>
        <button onclick="window.location.href = nextPage"> DEV Continue </button>
    </div>

    <game-navigation></game-navigation>

    <script>       
        // =====================================================
        // ELEMENTS
        // =====================================================

        const callScreen = document.getElementById("callScreen");
        const incomingText = document.getElementById("incomingText");
        const stationContent = document.getElementById("stationContent");

        const acceptCallButton = document.getElementById("acceptCallButton");
        const declineCallButton = document.getElementById("declineCallButton");
        const person = document.querySelector(".person-container");
        const audioButton = document.getElementById("audioBtn");
        const subtitle = document.getElementById("subtitle");
        const choices = document.getElementById("choices");
        const riddleButton = document.getElementById("riddle_btn");
        const callActions = document.getElementById("callActions");
        const callHelp = document.getElementById("callHelp");
        const ringtone = document.getElementById("ringtone");
        const hangUpButton =
            document.getElementById("hangUpButton");

        const moreButton =
            document.getElementById("moreButton");

        const reactionMenu =
            document.getElementById("reactionMenu");

        const reactionButtons =
            document.querySelectorAll(".reaction-option");

        // Audio IDs must match the HTML IDs above.
        const audio1 = document.getElementById("voice1");
        const audio2 = document.getElementById("voice2");
        const audio2B = document.getElementById("voice3");
        const audio2C = document.getElementById("voice4");
        const audio3 = document.getElementById("voice5");
        const audio3D = document.getElementById("voice6");
        const audio3E = document.getElementById("voice7");

        const allAudios = [
            audio1,
            audio2,
            audio2B,
            audio2C,
            audio3,
            audio3D,
            audio3E
        ];

        const buttons = {
            A: document.getElementById("btnA"),
            B: document.getElementById("btnB"),
            C: document.getElementById("btnC"),
            D: document.getElementById("btnD"),
            E: document.getElementById("btnE")
        };

        // =====================================================
        // REACTION
        // =====================================================
        function openReactionMenu() {
            reactionMenu.classList.remove("hidden");

            moreButton.setAttribute(
                "aria-expanded",
                "true"
            );
        }

        function closeReactionMenu() {
            reactionMenu.classList.add("hidden");

            moreButton.setAttribute(
                "aria-expanded",
                "false"
            );
        }

        function toggleReactionMenu(event) {
            event.stopPropagation();

            const menuIsOpen =
                !reactionMenu.classList.contains("hidden");

            if (menuIsOpen) {
                closeReactionMenu();
            } else {
                openReactionMenu();
            }
        }

        function showFloatingReaction(emoji) {
            const floatingReaction =
                document.createElement("div");

            floatingReaction.className =
                "floating-reaction";

            floatingReaction.textContent = emoji;

            const buttonPosition =
                moreButton.getBoundingClientRect();

            const randomOffset =
                Math.random() * 60 - 30;

            floatingReaction.style.left =
                `${buttonPosition.left +
                buttonPosition.width / 2 +
                randomOffset
                }px`;

            floatingReaction.style.top =
                `${buttonPosition.top - 8}px`;

            document.body.appendChild(
                floatingReaction
            );

            window.setTimeout(() => {
                floatingReaction.remove();
            }, 1800);
        }

        moreButton.addEventListener(
            "click",
            toggleReactionMenu
        );

        reactionMenu.addEventListener(
            "click",
            event => {
                event.stopPropagation();
            }
        );

        reactionButtons.forEach(button => {
            button.addEventListener("click", () => {
                const emoji =
                    button.dataset.reaction;

                showFloatingReaction(emoji);
                closeReactionMenu();
            });
        });

        document.addEventListener(
            "click",
            closeReactionMenu
        );

        document.addEventListener(
            "keydown",
            event => {
                if (event.key === "Escape") {
                    closeReactionMenu();
                }
            }
        );

        hangUpButton.addEventListener("click", () => {
            stopRingtone();
            stopOtherAudios(null);

            window.location.href = previousPage;
        });
        // =====================================================
        // RINGTONE
        // =====================================================
        let ringtoneStarted = false;

        async function activateIncomingCall() {
            if (ringtoneStarted) {
                return;
            }

            ringtone.muted = false;
            ringtone.volume = 0.55;
            ringtone.currentTime = 0;

            try {
                await ringtone.play();

                ringtoneStarted = true;

                callActions.classList.remove("controls-hidden");
                callActions.classList.add("controls-visible");

                callHelp.textContent =
                    "Answer or decline the call";
            } catch (error) {
                console.error(
                    "Ringtone could not start:",
                    error
                );

                callHelp.textContent =
                    "Tap again to enable the ringtone";
            }
        }

        function stopRingtone() {
            ringtone.pause();
            ringtone.currentTime = 0;
            ringtoneStarted = false;
        }
        callActions.addEventListener(
            "pointerdown",
            event => {
                event.stopPropagation();
            }
        );

        callScreen.addEventListener(
            "pointerdown",
            activateIncomingCall
        );

        // =====================================================
        // ANSWER TEXT
        // =====================================================

        const answerText = {
            A: "Yes! How can we help you?",
            B: "Thanks a lot! Good bye!",
            C: "Thanks a lot! How did you know about it?",
            D: "Yes, of course. We talked with him in the beginning. Why do you know him?",
            E: "No, who is that?"
        };

        Object.entries(buttons).forEach(([key, button]) => {
            button.textContent = answerText[key];
            button.style.display = "none";
        });

        // =====================================================
        // STATE
        // =====================================================

        let currentAudio = audio1;
        let callAccepted = false;

        // =====================================================
        // CHOICE HELPERS
        // =====================================================

        function hideChoices() {
            choices.style.display = "none";

            Object.values(buttons).forEach(button => {
                button.style.display = "none";
            });
        }

        function showChoices(...keys) {
            Object.entries(buttons).forEach(([key, button]) => {
                button.style.display =
                    keys.includes(key) ? "block" : "none";
            });

            choices.style.display = "block";
        }

        // =====================================================
        // AUDIO HELPERS
        // =====================================================

        function stopOtherAudios(audioToKeep) {
            allAudios.forEach(audio => {
                if (audio !== audioToKeep) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
        }

        async function playAudio(audio, restart = true) {
            if (!audio) {
                subtitle.textContent =
                    "The audio element could not be found.";

                console.error("Missing audio element.");
                return;
            }

            hideChoices();
            stopOtherAudios(audio);

            currentAudio = audio;

            audio.muted = false;
            audio.volume = 1;

            if (restart) {
                audio.currentTime = 0;
            }

            try {
                await audio.play();
                person.classList.add("speaking");
            } catch (error) {
                person.classList.remove("speaking");

                subtitle.textContent =
                    "Press the speaker button to continue.";

                console.error(
                    "Audio playback failed:",
                    error
                );
            }
        }

        function finishConversation() {
            hideChoices();
            currentAudio = null;
            subtitle.textContent = "";
            person.classList.remove("speaking");
            riddleButton.style.display = "block";
            audioButton.classList.remove("is-active");
            closeReactionMenu();
        }

        // =====================================================
        // INCOMING CALL
        // =====================================================

        acceptCallButton.addEventListener(
            "click",
            async event => {
                event.stopPropagation();

                stopRingtone();

                callAccepted = true;

                callScreen.style.display = "none";
                stationContent.style.display = "block";

                await playAudio(audio1);
            }
        );

        declineCallButton.addEventListener(
            "click",
            event => {
                event.stopPropagation();

                stopRingtone();

                incomingText.textContent =
                    "Call missed...";

                callActions.classList.remove(
                    "controls-visible"
                );

                callActions.classList.add(
                    "controls-hidden"
                );

                callHelp.textContent =
                    "The call was declined";
            }
        );
        // =====================================================
        // SPEAKER BUTTON
        // =====================================================

        audioButton.addEventListener("click", async () => {
            if (!callAccepted || !currentAudio) {
                return;
            }

            if (currentAudio.paused) {
                try {
                    currentAudio.muted = false;
                    currentAudio.volume = 1;

                    await currentAudio.play();

                    person.classList.add("speaking");
                } catch (error) {
                    subtitle.textContent =
                        "The audio could not be played.";

                    console.error(
                        "Audio playback failed:",
                        error
                    );
                }

                return;
            }

            currentAudio.pause();

            person.classList.remove("speaking");
        });

        // =====================================================
        // ANSWER BUTTONS
        // =====================================================

        buttons.A.addEventListener("click", () => {
            playAudio(audio2);
        });

        buttons.B.addEventListener("click", () => {
            playAudio(audio2B);
        });

        buttons.C.addEventListener("click", () => {
            playAudio(audio2C);
        });

        buttons.D.addEventListener("click", () => {
            playAudio(audio3D);
        });

        buttons.E.addEventListener("click", () => {
            playAudio(audio3E);
        });

        // =====================================================
        // CONVERSATION FLOW
        // =====================================================

        const afterAudio = new Map([
            // Audio 1 ends.
            [audio1, () => {
                showChoices("A");
            }],

            // Audio 2 ends.
            [audio2, () => {
                showChoices("B", "C");
            }],

            // B ends the conversation.
            [audio2B, () => {
                finishConversation();
            }],

            // C continues to D and E.
            [audio2C, () => {
                showChoices("D", "E");
            }],

            // D automatically continues to common Audio 3.
            [audio3D, () => {
                playAudio(audio3);
            }],

            // E automatically continues to common Audio 3.
            [audio3E, () => {
                playAudio(audio3);
            }],

            // Common Audio 3 ends the conversation.
            [audio3, () => {
                finishConversation();
            }]
        ]);

        allAudios.forEach(audio => {
            audio.addEventListener("play", () => {
                currentAudio = audio;

                person.classList.add("speaking");
                audioButton.classList.add("is-active");
            });

            audio.addEventListener("pause", () => {
                if (!audio.ended) {
                    person.classList.remove("speaking");
                    audioButton.classList.remove("is-active");
                }
            });

            audio.addEventListener("ended", () => {
                audioButton.classList.remove("is-active");
                person.classList.remove("speaking");

                subtitle.textContent = "";

                const nextAction = afterAudio.get(audio);

                if (nextAction) {
                    nextAction();
                }
            });

            audio.addEventListener("error", () => {
                const source =
                    audio.querySelector("source");

                const path = source
                    ? source.getAttribute("src")
                    : "unknown audio path";

                subtitle.textContent =
                    "Audio file could not be loaded.";

                person.classList.remove("speaking");

                console.error(
                    "Could not load audio:",
                    path,
                    audio.error
                );
            });
        });

        // =====================================================
        // SUBTITLE TEXT
        // =====================================================

        const subtitleLines = new Map([
            [audio1, [
                "Hello?",
                "Can you hear me?",
                "This is Roald Amundsen speaking."
            ]],

            [audio2, [
                "No, I believe it is the other way around.",
                "I heard from my colleagues that you are on a rescue mission.",
                "During my expeditions, I had several safety depots.",
                "I will send you some notes to help you find the coordinates.",
                "These depots will help your crew.",
                "You will find the notes in your inventory."
            ]],

            [audio2B, [
                "No problem.",
                "I would go myself if I could.",
                "Good luck, explorers."
            ]],

            [audio2C, [
                "I heard about it from my old friend Fridtjof.",
                "Do you know who?"
            ]],

            [audio3D, [
                "Then you have already spoken with a wise man.",
                "Nansen advised me before my Northwest Passage expedition.",
                "Later, I was allowed to use the Fram for an expedition that was meant to go north.",
                "Small laugh.",
                "But plans can change.",
                "I took the Fram south instead — and reached the South Pole."
            ]],

            [audio3E, [
                "Ah, my friends!",
                "You know him properly as Nansen.",
                "He was one of Norway's great polar explorers.",
                "He advised me before my Northwest Passage expedition.",
                "Later, I was allowed to use the Fram for an expedition that was meant to go north.",
                "Small laugh.",
                "But plans can change.",
                "I took the Fram south instead — and reached the South Pole."
            ]],

            [audio3, [
                "The crew you are searching for is trapped in the north.",
                "I never reached the North Pole by ship.",
                "But later, I crossed the Arctic Ocean by airship.",
                "It was called Norge.",
                "You understand the name, yes?",
                "Norge — Norway.",
                "But enough history.",
                "Your friends need you.",
                "Use my depot notes.",
                "Find the coordinates."
            ]]
        ]);

        // =====================================================
        // AUTOMATIC SUBTITLE TIMING
        // =====================================================

        const subtitleCues = new Map();

        function subtitleWeight(text) {
            const spokenText = text
                .replace(/\*[^*]+\*/g, "")
                .trim();
            const wordCount = spokenText
                ? spokenText.split(/\s+/).length
                : 2;
            return Math.max(wordCount, 3);
        }

        function buildSubtitleCues(audio) {
            const lines = subtitleLines.get(audio) || [];
            const duration = audio.duration;
            if (
                !lines.length ||
                !Number.isFinite(duration) ||
                duration <= 0
            ) {
                return [];
            }
            const weights = lines.map(subtitleWeight);
            const totalWeight = weights.reduce((sum, weight) => sum + weight,0);
            let start = 0;

            return lines.map((text, index) => {
                const isLastLine = index === lines.length - 1;
                const lineDuration =
                    duration *
                    (weights[index] / totalWeight);

                const end = isLastLine
                    ? duration + 0.05
                    : start + lineDuration;

                const cue = {
                    start,
                    end,
                    text
                };

                start = end;
                return cue;
            });
        }

        function prepareSubtitles(audio) {
            subtitleCues.set(
                audio,
                buildSubtitleCues(audio)
            );
        }

        function updateSubtitle(audio) {
            const cues =
                subtitleCues.get(audio) || [];

            const currentTime =
                audio.currentTime;

            const cue = cues.find(item => {
                return (
                    currentTime >= item.start &&
                    currentTime < item.end
                );
            });

            subtitle.textContent =
                cue ? cue.text : "";
        }

        allAudios.forEach(audio => {
            audio.addEventListener(
                "loadedmetadata",
                () => {
                    prepareSubtitles(audio);
                }
            );

            audio.addEventListener(
                "durationchange",
                () => {
                    prepareSubtitles(audio);
                }
            );

            audio.addEventListener(
                "timeupdate",
                () => {
                    updateSubtitle(audio);
                }
            );
        });

        // =====================================================
        // GAME SETUP
        // =====================================================

        if (typeof setupGameNavigation === "function") {
            setupGameNavigation();
        }

        if (typeof loadInventoryScripts === "function") {
            loadInventoryScripts().then(() => {
                if (
                    typeof addAmundsenProfileToInventory ===
                    "function"
                ) {
                    addAmundsenProfileToInventory();
                }
            });
        }
    </script>
</body>
</html>
