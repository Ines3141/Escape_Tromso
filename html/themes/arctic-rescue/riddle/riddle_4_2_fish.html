<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title> FISHER MONUMENT </title>
    <link rel="stylesheet" href="../../../../CSS/global.css"> <!-- link to style sheet -->
    <link rel="stylesheet" href="../../../../CSS/arctic-theme.css">
    <script src="../../../../Stations/JAVA/navigation.js"></script>
    <script>
        const previousPage = "../stations/station_4_1.html";
        const nextPage = "riddle_4_3_location.html";
    </script>
    <style>
        .cube-arrow {
            width: 50px;
            height: 50px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: #333;
            color: white;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            background: lightblue;
            color: #123;
        }

            .cube-arrow:hover {
                background: #555;
                transform: scale(1.08);
            }

            .cube-arrow:active {
                transform: scale(0.95);
            }
    </style>
</head>

<body>
    <div class="box">
        <h2>Monument Cube Riddle</h2>
        <p>Count the fish on the monument to find the two starting numbers.</p>
        <p>Hint: Each opposite side must add up to 10.</p>
        <div class="cube-scene">
            <div class="monument-holder">
                <img class="monument-standing" src="../../../../assets/images/Monument.jpg" alt="Monument">
            </div>
            <div class="cube" id="cube">
                <div class="face front">
                    <span class="fish-symbol">&#128031;</span>
                    <input type="number" id="front" placeholder="?">
                </div>
                <div class="face back">
                    <input type="number" id="back" placeholder="?">
                </div>
                <div class="face right">
                    <input type="number" id="right" placeholder="?">
                </div>
                <div class="face left">
                    <span class="fish-symbol">&#128031;</span>
                    <input type="number" id="left" placeholder="?">
                </div>
            </div>
        </div>
        <div class="cube-buttons">
            <button class="cube-arrow" onclick="rotateCube(-90)">←</button>
            <button class="cube-arrow" onclick="rotateCube(90)">→</button>
        </div>
        <button onclick="checkCube()">Check Answer</button>

        <p id="feedback"></p>

        <button class="submit-button" id="submit" onclick="window.location.href = nextPage">
            Continue
        </button>
        <script>
            let rotation = 0;

            function rotateCube(degrees) {
                rotation += degrees;
                document.getElementById("cube").style.transform =
                    `rotateX(-20deg) rotateY(${rotation}deg)`;
            }

            function checkCube() {
                const front = Number(document.getElementById("front").value);
                const back = Number(document.getElementById("back").value);
                const left = Number(document.getElementById("left").value);
                const right = Number(document.getElementById("right").value);

                const feedback = document.getElementById("feedback");

                const allNumbers = [front, back, left, right];

                const hasCorrectNumbers =
                    allNumbers.includes(8) &&
                    allNumbers.includes(6) &&
                    allNumbers.includes(2) &&
                    allNumbers.includes(4);

                const oppositeSidesCorrect =
                    front + back === 10 &&
                    left + right === 10;

                if (hasCorrectNumbers && oppositeSidesCorrect) {
                    feedback.textContent = "Correct! The monument stands in balance.";
                    window.location.href = nextPage;
                } else {
                    feedback.textContent = "Not quite. Count the fish and balance each opposite side to 10.";
                }
            }
        </script>
    </div>
    <game-navigation></game-navigation>
    <script>
        setupGameNavigation();
    </script>
</body>

</html>
