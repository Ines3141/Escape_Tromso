<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Station 3</title>
    <link rel="stylesheet" href="../../CSS/global.css">
    <link rel="stylesheet" href="../../CSS/station.css">
</head>
<body>
    <div class="box">
        <button id="settingsBtn" class="settings-btn">&#9881</button>

        <div id="settingsMenu" class="settings-menu hidden">
            <!-- <button>Replay Audio</button> -->
            <label for="volumeSlider">Volume</label>
            <input id="volumeSlider" type="range" min="0" max="1" step="0.1" value="1">
            <button>Show Hint</button> <!-- Not necessary with Sation side-->
            <button id="Location_btn">Show location</button>
            <button>About Wanny Woldstad</button>
            <!--Maybe more ifnormation is nice. For people who are interested -->
        </div>
        <h1>Station 3</h1>
        <p> Wanny Woldstad </p>

        <div class="person-container">
            <img src="../../Images/Wanny.jpg" alt="Station 3" class="imag-person">
        </div>
        <div class="audio-row">
            <button class="audio-btn" id="audioBtn"> &#128266;</button>
            <div id="subtitle" class="subtitle"></div>
        </div>
        <audio id="voice" preload="auto">
            <source src="../../Audio/Wanny1.mp4" type="audio/mp4">
        </audio>
        <audio id="voiceA" preload="auto">
            <source src="../../Audio/WannyA.mp4" type="audio/mp4">
        </audio>
        <audio id="voiceB" preload="auto">
            <source src="../../Audio/WannyB.mp4" type="audio/mp4">
        </audio>
        <audio id="voiceC" preload="auto">
            <source src="../../Audio/WannyC.mp4" type="audio/mp4">
        </audio>
        <div id="choices" style="display:none;">
            <button id="btnA" class="answer-button"></button>
            <button id="btnB" class="answer-button"></button>
            <button id="btnC" class="answer-button" style="display:none;"></button>
        </div>

        <button class="back-button" onclick="window.location.href='station_2.html'">
            Back
        </button>
        <!-- for actual game do </button>style="display:none;">, but now it is just blocking -->

        <button class="riddle-button" id="riddle_btn" onclick="window.location.href='../../Riddle/riddle_3.html'">
            Solve Riddle
        </button>

        <script>
            /* Audio */
            const audio = document.getElementById("voice");
            const audioA = document.getElementById("voiceA");
            const audioB = document.getElementById("voiceB");
            const audioC = document.getElementById("voiceC");

            /* Buttons */
            const btnA = document.getElementById("btnA");
            const btnB = document.getElementById("btnB");
            const btnC = document.getElementById("btnC");
            const audio_btn = document.getElementById("audioBtn");
            const riddle_btn = document.getElementById("riddle_btn");
            const location_btn = document.getElementById("Location_btn");

            const choices = document.getElementById("choices");
            const settingsBtn = document.getElementById("settingsBtn");
            const settingsMenu = document.getElementById("settingsMenu");
            const subtitle = document.getElementById("subtitle");
            const allAudios = [audio, audioA, audioB, audioC];
            const volumeSlider = document.getElementById("volumeSlider");

            const person = document.querySelector(".person-container");
            /* Location Link to Map */ 
            location_btn.addEventListener("click", () => {
                window.open('https://www.google.com/maps/search/Wanny+tromsoe');
            }) 
            /* Change Volume */
            volumeSlider.addEventListener("input", () => {
                allAudios.forEach(sound => {
                    sound.volume = volumeSlider.value;
                });
            });
            /* Start the audio file and the subtitels. */
            audio_btn.addEventListener("click", () => {
                if (audio.paused) {
                    audio.play();
                    person.classList.add("speaking");
                } else {
                    audio.pause();
                    person.classList.remove("speaking");
                }
            });
            /* If audio ends, show answer options A and B*/
            audio.addEventListener("ended", () => {
                person.classList.remove("speaking");
                btnA.textContent =
                    "We need help rescuing some friends.";
                btnB.textContent =
                    "First female hunter on Svalbard? Tell us more!";
                btnC.style.display = "none";
                choices.style.display = "block";
            });
            btnA.addEventListener("click", () => {
                choices.style.display = "none";
                if (audioA.paused) {
                    audioA.play();
                    person.classList.add("speaking");
                } else {
                    audioA.pause();
                    person.classList.remove("speaking");
                }
            });
            audioA.addEventListener("ended", () => {
                person.classList.remove("speaking");
                riddle_btn.style.display = "block"
                /*
                NO MORE INTERACTION 
                IF THIS IS THE LAST PART OF THE CONVERSATION 
                SHOW BUTTON
                TO SOLVE RIDDLE IF ISNT YOU NEED MORE BLOCKS*/
            });
            btnB.addEventListener("click", () => {
                choices.style.display = "none";
                if (audioB.paused) {
                    audioB.play();
                    person.classList.add("speaking");
                } else {
                    audioB.pause();
                    person.classList.remove("speaking");
                }
            });
            audioB.addEventListener("ended", () => {
                person.classList.remove("speaking");
                btnA.style.display = "none";
                btnB.style.display = "none";
                btnC.textContent =
                    "Our friends are trapped in the ice and need help.";
                btnC.style.display = "block";
                choices.style.display = "block";
            });
            btnC.addEventListener("click", () => {
                choices.style.display = "none";
                if (audioC.paused) {
                    audioC.play();
                    person.classList.add("speaking");
                } else {
                    audioC.pause();
                    person.classList.remove("speaking");
                }
            });
            audioC.addEventListener("ended", () => {
                person.classList.remove("speaking");
                riddle_btn.style.display = "block";
            });

            const subtitles = [
                { start: 0, end: 2, text: "Huhuuuu!" },
                { start: 2, end: 5, text: "I'm Wanny Woldstad." },
                { start: 5, end: 8, text: "Hunter, trapper and adventurer." },
                { start: 8, end: 10, text: "Need a ride?" }
            ];

            const subtitlesA = [
                { start: 1, end: 3, text: "That's a proper reason to visit." },
                { start: 3, end: 7, text: "Good communication can save lives." },
                { start: 7, end: 11, text: "Take these notes on radio frequencies." },
                { start: 11, end: 14, text: "They may help your rescue mission." },
                { start: 14, end: 17, text: "Good luck, explorers!" }
            ];

            const subtitlesB = [
                { start: 10, end: 13, text: "I was the first female hunter on Svalbard." },
                { start: 13, end: 16, text: "And Northern Norway's first female taxi driver." },
                { start: 16, end: 20, text: "I spent five winters on Svalbard." },
                { start: 20, end: 23, text: "That teaches you a thing or two." } 
            ];

            const subtitlesC = [
                { start: 1, end: 3, text: "That's a proper reason to visit." },
                { start: 3, end: 7, text: "Good communication can save lives." },
                { start: 7, end: 11, text: "Take these notes on radio frequencies." },
                { start: 11, end: 14, text: "They may help your rescue mission." },
                { start: 14, end: 17, text: "Good luck, explorers!" }
            ];

            function updateSubtitle(audioFile, subtitleList) {
                const current = audioFile.currentTime;

                const line = subtitleList.find(sub =>
                    current >= sub.start && current <= sub.end
                );

                subtitle.textContent = line ? line.text : "";
            }

            /* Add subtitels to all options */
            audio.addEventListener("timeupdate", () => {
                updateSubtitle(audio, subtitles);
            });
            audioA.addEventListener("timeupdate", () => {
                updateSubtitle(audioA, subtitlesA);
            });
            audioB.addEventListener("timeupdate", () => {
                updateSubtitle(audioB, subtitlesB);
            });
            audioC.addEventListener("timeupdate", () => {
                updateSubtitle(audioC, subtitlesC);
            });


            settingsBtn.addEventListener("click", (event) => {
                event.stopPropagation();
                settingsMenu.classList.toggle("hidden");
            });
            settingsMenu.addEventListener("click", (event) => {
                event.stopPropagation();
            });
            document.addEventListener("click", () => {
                settingsMenu.classList.add("hidden");
            });
        </script>

    </div>

</body>
</html>
