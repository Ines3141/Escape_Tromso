<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <title>Station 6</title>

    <link rel="stylesheet" href="../../../../CSS/global.css">
    <link rel="stylesheet" href="../../../../CSS/station.css">
    <link rel="stylesheet" href="../../../../CSS/attachments.css">

    <script src="../../../../Stations/JAVA/navigation.js"></script>
    <script src="../../../../Stations/JAVA/inventory.js"></script>
    <script src="../../../../Stations/JAVA/story_data.js"></script>
    <script src="../../../../Stations/JAVA/attachments.js"></script>
    <script src="../../../../Stations/JAVA/story_chat.js"></script>

    <script>
        const previousPage = "../riddle/riddle_5_4_location.html";
        const nextPage = "../riddle/riddle_6_2_chat.html";

        function resetDispatchChat() {
            localStorage.removeItem("dispatch_henry_intro_step");
            localStorage.removeItem("dispatch_henry_intro_scroll");
            location.reload();
        }

        function resetRudiInventory() {
            removeInventoryItem("profile-rudi");
            location.reload();
        }
    </script>
</head>

<body>
    <div class="box">
        <h1>Henry Rudi</h1>

        <story-chat story="dispatch_henry_intro"></story-chat>

        <!-- temporary test button -->
        <button class="riddle-button" id="riddle_btn" onclick="window.location.href = nextPage">
            Solve Riddle
        </button>

        <button onclick="resetDispatchChat()">
            Reset chat
        </button>

        <button onclick="resetRudiInventory()">
            Reset Rudi Inventory
        </button>
    </div>

    <game-navigation></game-navigation>

    <script>
        setupGameNavigation();
        loadInventoryScripts().then(() => {
            addRudiProfileToInventory();
        });
    </script>
</body>

</html>
