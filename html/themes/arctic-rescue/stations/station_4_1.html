<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Intercepted</title>

    <script src="../../../../Stations/JAVA/navigation.js"></script>

    <script>
        const previousPage = "../riddle/riddle_3_4_location.html";
        const nextPage = "../riddle/riddle_4_2_fish.html";
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #04111d;
            color: white;
            overflow: hidden;
        }

        .chat-page {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #0d2f4f, #04111d 70%);
        }

        .chat-box {
            width: min(92vw, 420px);
            background: #0b2232;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

            .chat-box h2 {
                margin-top: 0;
            }

        .message {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            margin: 10px 0;
        }

            .message.system {
                color: #9fd3ff;
            }

        .attack-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            overflow: hidden;
        }

            .attack-overlay.active {
                display: flex;
            }

        .flicker {
            animation: flicker 0.18s infinite;
        }

        @keyframes flicker {
            0% {
                opacity: 1;
            }

            20% {
                opacity: 0.75;
            }

            40% {
                opacity: 1;
            }

            60% {
                opacity: 0.82;
            }

            80% {
                opacity: 1;
            }

            100% {
                opacity: 0.72;
            }
        }

        .scanlines::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient( to bottom, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, transparent 2px, transparent 4px );
            pointer-events: none;
            z-index: 2;
        }

        .noise {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 6px 6px;
            opacity: 0.08;
            animation: noiseMove 0.15s infinite;
            pointer-events: none;
        }

        @keyframes noiseMove {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(2px, -1px);
            }

            50% {
                transform: translate(-2px, 2px);
            }

            75% {
                transform: translate(1px, -2px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        .disconnect-text {
            font-size: 2rem;
            font-weight: bold;
            color: #ff4040;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            z-index: 3;
        }

            .disconnect-text.show {
                display: block;
            }

        .code-box {
            width: min(90vw, 700px);
            min-height: 220px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff66;
            border-radius: 10px;
            padding: 20px;
            font-family: monospace;
            font-size: 14px;
            color: #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            overflow: hidden;
            display: none;
            z-index: 3;
        }

            .code-box.show {
                display: block;
            }

        .code-line {
            white-space: pre-wrap;
            margin: 4px 0;
        }

        .code-green {
            color: #00ff66;
        }

        .code-red {
            color: #ff4c4c;
        }

        .code-blue {
            color: #4db8ff;
        }

        .code-yellow {
            color: #ffe066;
        }

        .mask-wrap {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 4;
        }

            .mask-wrap.show {
                display: flex;
            }

        .mask-image {
            width: min(70vw, 360px);
            border-radius: 14px;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.18);
            animation: maskPulse 1.6s infinite alternate;
        }

        @keyframes maskPulse {
            from {
                transform: scale(1);
                filter: brightness(0.9);
            }

            to {
                transform: scale(1.04);
                filter: brightness(1.1);
            }
        }

        .mask-text {
            margin-top: 16px;
            color: white;
            font-size: 1.1rem;
            text-align: center;
            max-width: 600px;
        }

        .video-wrap {
            display: none;
            z-index: 5;
            width: min(92vw, 850px);
        }

            .video-wrap.show {
                display: block;
            }

        video {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            background: black;
        }

        .continue-btn {
            display: none;
            margin: 18px auto 0;
            padding: 14px 26px;
            border: none;
            border-radius: 999px;
            background: #27a8ff;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

            .continue-btn.show {
                display: block;
            }

        .glitch {
            position: relative;
            animation: glitchMove 0.2s infinite;
        }

        @keyframes glitchMove {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(2px, -1px);
            }

            50% {
                transform: translate(-2px, 1px);
            }

            75% {
                transform: translate(1px, 2px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        .blackout {
            position: fixed;
            inset: 0;
            background: black;
            opacity: 0;
            pointer-events: none;
            z-index: 10000;
            transition: opacity 0.15s ease;
        }

            .blackout.show {
                opacity: 1;
            }
    </style>
</head>

<body>
    <div class="chat-page" id="chatPage">
        <div class="chat-box">
            <h2>Dispatcher Team</h2>
            <div class="message">We are receiving your signal...</div>
            <div class="message">Stay connected. We are sending the next coordinates.</div>
            <div class="message system" id="statusMessage">Connection stable.</div>
        </div>
    </div>

    <div class="attack-overlay scanlines" id="attackOverlay">
        <div class="noise"></div>

        <div class="disconnect-text glitch" id="disconnectText">
            Connection interrupted
        </div>

        <div class="code-box" id="codeBox"></div>

        <div class="mask-wrap" id="maskWrap">
            <img class="mask-image" src="../../../../assets/images/mask_hacker.png" alt="Mask">
            <div class="mask-text" id="maskText">
                We have taken over this communication channel.
            </div>
        </div>

        <div class="video-wrap" id="videoWrap">
            <video id="hackerVideo" controls playsinline preload="auto" muted>
                <source src="../../../../assets/images/hacker_video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <button class="continue-btn" id="continueBtn">Continue</button>
        </div>
    </div>

    <div class="blackout" id="blackout"></div>

    <!-- Keep these for later. They are not used in the JavaScript yet. -->
    <audio id="glitchSound" src="../../../../assets/audio/glitch.mp3" preload="auto"></audio>
    <audio id="staticSound" src="../../../../assets/audio/static.mp3" preload="auto"></audio>
    <audio id="boomSound" src="../../../../assets/audio/impact.mp3" preload="auto"></audio>

    <!-- This is the only audio currently used. It starts when the user presses play on the video. -->
    <audio id="monumentSound" src="../../../../assets/audio/Monument.mp4" preload="auto"></audio>

    <game-navigation></game-navigation>

    <script>
        setupGameNavigation();
    </script>

    <script>
        const statusMessage = document.getElementById("statusMessage");
        const attackOverlay = document.getElementById("attackOverlay");
        const disconnectText = document.getElementById("disconnectText");
        const codeBox = document.getElementById("codeBox");
        const maskWrap = document.getElementById("maskWrap");
        const videoWrap = document.getElementById("videoWrap");
        const hackerVideo = document.getElementById("hackerVideo");
        const continueBtn = document.getElementById("continueBtn");
        const blackout = document.getElementById("blackout");
        const monumentSound = document.getElementById("monumentSound");

        let monumentStarted = false;

        const codeLines = [
            { text: "[ SIGNAL OVERRIDE INITIATED ]", cls: "code-red" },
            { text: "inject_channel(dispatcher.main_link)", cls: "code-green" },
            { text: "bypass_protocol(alpha.473)", cls: "code-blue" },
            { text: "target_team = 'expedition'", cls: "code-yellow" },
            { text: "disabling remote relay...", cls: "code-green" },
            { text: "intercept_success = TRUE", cls: "code-red" },
            { text: "opening private transmission...", cls: "code-blue" }
        ];

        function appendCodeLine(line) {
            const div = document.createElement("div");
            div.className = `code-line ${line.cls}`;
            div.textContent = line.text;
            codeBox.appendChild(div);
            codeBox.scrollTop = codeBox.scrollHeight;
        }

        function flickerBlackout(times = 4, delay = 120) {
            let count = 0;

            const interval = setInterval(() => {
                blackout.classList.add("show");

                setTimeout(() => {
                    blackout.classList.remove("show");
                }, 70);

                count++;

                if (count >= times) {
                    clearInterval(interval);
                }
            }, delay);
        }

        function startAttackSequence() {
            statusMessage.textContent = "Signal unstable...";
            statusMessage.style.color = "#ffcc66";

            setTimeout(() => {
                attackOverlay.classList.add("active", "flicker");
                disconnectText.classList.add("show");

                flickerBlackout(5, 130);
            }, 1200);

            setTimeout(() => {
                disconnectText.textContent = "Unauthorized access";
            }, 2500);

            setTimeout(() => {
                disconnectText.classList.remove("show");
                codeBox.classList.add("show");
                showCodeAnimation();
            }, 3800);
        }

        function showCodeAnimation() {
            let i = 0;

            const interval = setInterval(() => {
                appendCodeLine(codeLines[i]);
                i++;

                if (i >= codeLines.length) {
                    clearInterval(interval);

                    setTimeout(() => {
                        codeBox.classList.remove("show");
                        showMask();
                    }, 1400);
                }
            }, 500);
        }

        function showMask() {
            flickerBlackout(3, 140);
            maskWrap.classList.add("show");

            setTimeout(() => {
                maskWrap.style.display = "none";
                showVideo();
            }, 3500);
        }

        function showVideo() {
            videoWrap.classList.add("show");

            hackerVideo.muted = true;
            hackerVideo.controls = true;
            hackerVideo.load();
        }

        hackerVideo.addEventListener("play", () => {
            if (!monumentStarted) {
                monumentSound.currentTime = 0;
                monumentSound.volume = 1;
                monumentStarted = true;
            }

            monumentSound.play().catch(error => {
                console.log("Audio could not start with video play:", error);
            });
        });

        hackerVideo.addEventListener("pause", () => {
            monumentSound.pause();
        });

        hackerVideo.addEventListener("ended", () => {
            monumentSound.pause();
            monumentSound.currentTime = 0;
            continueBtn.classList.add("show");
        });

        continueBtn.addEventListener("click", () => {
            window.location.href = nextPage;
        });

        setTimeout(() => {
            startAttackSequence();
        }, 1500);
    </script>
</body>

</html>
