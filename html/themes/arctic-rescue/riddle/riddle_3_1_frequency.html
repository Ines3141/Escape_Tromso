<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Riddle Wanny Woldstad</title>
    <link rel="stylesheet" href="../../../../CSS/global.css"> <!-- link to style sheet -->
    <link rel="stylesheet" href="../../../../CSS/arctic-theme.css">
    <script src="../../../../Stations/JAVA/navigation.js"></script>
    <script>
        const previousPage = "../stations/station_3_0.html";
        const nextPage = "../stations/station_3_2.html";
    </script>
    <style>
        .signal-console {
            max-width: 620px;
            margin: 24px auto;
            padding: 22px;
            border-radius: 22px;
            background: #071827;
            color: white;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        #signalCanvas {
            width: 100%;
            max-width: 500px;
            height: 220px;
            background: #020812;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
        }

        .knob-row {
            margin-top: 22px;
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .knob-control {
            text-align: center;
        }

        .knob {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 4px solid #777;
            background: repeating-conic-gradient(#444 0deg 10deg, #777 10deg 20deg);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease;
        }

        .knob-marker {
            position: absolute;
            top: 6px;
            left: 50%;
            width: 6px;
            height: 18px;
            background: #111;
            border-radius: 4px;
            transform: translateX(-50%);
        }

        .knob-number {
            margin-top: 8px;
            font-size: 22px;
            font-weight: 900;
            color: white;
        }

        .knob::after {
            content: "";
        }

        .knob-control p {
            margin-top: 8px;
            font-size: 13px;
            opacity: 0.85;
        }

        #signalFeedback {
            min-height: 24px;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .signal-console {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                margin: 10px auto;
                padding: 14px 10px;
            }

            .knob-row {
                gap: clamp(10px, 4vw, 16px);
            }

            .knob-control {
                flex: 0 0 auto;
                min-width: 0;
            }

            .knob {
                width: 56px !important;
                height: 56px !important;
                min-width: 56px !important;
                min-height: 56px !important;
                flex: 0 0 56px;
                padding: 0 !important;
                border-radius: 50% !important;
                aspect-ratio: 1 / 1;
            }

            .knob-marker {
                top: 4px;
                width: 4px;
                height: 14px;
            }

            .knob-number {
                margin-top: 5px;
                font-size: 18px;
            }

            .knob-control p {
                margin-top: 5px;
                font-size: 11px;
            }
        }
    </style>

</head>
<body>
    <div class="box">
        <div class="signal-console">
            <h2>Signal Tuner</h2>

            <canvas id="signalCanvas" width="500" height="220"></canvas>
            <audio id="staticAudio" src="../../../../assets/audio/Noise_Wanny.mp3" loop></audio>
            <audio id="foxAudio" src="../../../../assets/audio/Old_Radio_Music.m4a"></audio>

            <div class="knob-row">
                <div class="knob-control">
                    <button class="knob" data-index="0">
                        <span class="knob-marker"></span>
                    </button>
                    <div class="knob-number">0</div>
                    <p>Breads</p>
                </div>

                <div class="knob-control">
                    <button class="knob" data-index="1">
                        <span class="knob-marker"></span>
                    </button>
                    <div class="knob-number">0</div>
                    <p>Wannies</p>
                </div>

                <div class="knob-control">
                    <button class="knob" data-index="2">
                        <span class="knob-marker"></span>
                    </button>
                    <div class="knob-number">0</div>
                    <p>Animals</p>
                </div>
            </div>

            <p id="signalFeedback"></p>

            <button id="continueBtn" style="display:none;">
                Signal matched - Continue
            </button>
            <!-- Remove later  
            <button onclick="window.location.href = nextPage">Continue (DEV)</button> -->
        </div>
        <script>
            const correctSettings = [6, 5, 2];
            let settings = [0, 0, 0];
            let knobRotations = [0, 0, 0];

            const canvas = document.getElementById("signalCanvas");
            const ctx = canvas.getContext("2d");

            const knobs = document.querySelectorAll(".knob");
            const feedback = document.getElementById("signalFeedback");
            const continueBtn = document.getElementById("continueBtn");

            function drawSignal() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawGrid();
                // Red target wave
                drawWave({
                    color: "red",
                    amplitude: 50,
                    frequency: 2,
                    phase: 0,
                    offsetY: canvas.height / 2
                });

                // Green player wave
                const playerAmplitude = settings[0] === 6 ? 50 : 20 + settings[0] * 5;
                const playerFrequency = settings[1] === 5 ? 2 : 0.75 + settings[1] * 0.25;
                //const playerPhase = settings[2] === 2 ? 0 : settings[2] * Math.PI / 4;

                const phaseValues = [
                    Math.PI / 2,
                    Math.PI,
                    0,
                    Math.PI * 1.5,
                    Math.PI / 4,
                    Math.PI * 0.75,
                    Math.PI * 1.25,
                    Math.PI * 1.75
                ];

                const playerPhase = phaseValues[settings[2]];


                drawWave({
                    color: "lime",
                    amplitude: playerAmplitude,
                    frequency: playerFrequency,
                    phase: playerPhase,
                    offsetY: canvas.height / 2
                });
            }

            function drawGrid() {
                ctx.strokeStyle = "rgba(255,255,255,0.08)";
                ctx.lineWidth = 1;

                for (let x = 0; x < canvas.width; x += 25) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }

                for (let y = 0; y < canvas.height; y += 25) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }

            function drawWave({ color, amplitude, frequency, phase, offsetY }) {
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;

                for (let x = 0; x < canvas.width; x++) {
                    const y =
                        offsetY +
                        Math.sin((x / canvas.width) * Math.PI * 2 * frequency + phase) * amplitude;

                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }

                ctx.stroke();
            }

            function updateKnobs() {
                knobs.forEach((knob, index) => {
                    const number = knob.parentElement.querySelector(".knob-number");
                    number.textContent = settings[index];

                    knob.style.transform = `rotate(${knobRotations[index]}deg)`;
                });
            }

            const staticAudio = document.getElementById("staticAudio");
            const foxAudio = document.getElementById("foxAudio");

            function checkSignal() {
                const solved = settings.every((value, index) => value === correctSettings[index]);

                if (solved) {
                    staticAudio.pause();
                    staticAudio.currentTime = 0;

                    foxAudio.currentTime = 0;
                    foxAudio.play();

                    feedback.textContent = "Signal matched.";
                    feedback.style.color = "lightgreen";
                    continueBtn.style.display = "inline-block";
                } else {
                    foxAudio.pause();
                    foxAudio.currentTime = 0;

                    staticAudio.volume = 0.25;
                    staticAudio.play();

                    feedback.textContent = "Signal unstable...";
                    feedback.style.color = "orange";
                    continueBtn.style.display = "none";
                }
            }

            knobs.forEach(knob => {
                knob.addEventListener("click", () => {
                    const index = Number(knob.dataset.index);

                    settings[index] = (settings[index] + 1) % 8;
                    knobRotations[index] += 45;

                    updateKnobs();
                    drawSignal();
                    checkSignal();
                });
            });

            continueBtn.addEventListener("click", () => {
                window.location.href = nextPage;
            });
        </script>
    </div>
    <game-navigation hint-id="riddle_3_1_frequency" location-id="station3-traffik"></game-navigation>
    <script>
        setupGameNavigation();
    </script>
</body>
</html>
