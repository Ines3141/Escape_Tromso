        const previousPage = "../riddle/riddle_3_1_frequency.html";
        const nextPage = "../riddle/riddle_3_3_maze.html";
    </script>
</head>
<body>
    <div class="box">
        <h1>Station 3</h1>
        <p> Wanny Woldstad </p>
        <div class="person-container">
            <img src="../../../../assets/images/Wanny.jpg" alt="Station 3" class="imag-person">

        <div class="audio-row">
            <button class="audio-btn" id="audioBtn"> &#128266;</button>

        </div>
        <audio id="voice1" preload="auto">
            <source src="../../../../assets/audio/Wanny/Wanny_1.mp3" type="audio/mp3">
        </audio>
        <audio id="voice2" preload="auto">
            <source src="../../../../assets/audio/Wanny/Wanny_2.mp3" type="audio/mp3">
        </audio>
        <audio id="voice3" preload="auto">
            <source src="../../../../assets/audio/Wanny/Wanny_3_B.m4a" type="audio/mp3">
        </audio>
        <audio id="voice4" preload="auto">
            <source src="../../../../assets/audio/Wanny/Wanny_3_C.mp3" type="audio/mp3">
        </audio>
        <audio id="voice7" preload="auto">
            <source src="../../../../assets/audio/Wanny/Wanny_4.mp3" type="audio/mp3">
        </audio>
        <audio id="voice5" preload="auto">
            <source src="../../../../assets/audio/Wanny/Wanny_4_D.mp3" type="audio/mp3">
        </audio>
        <audio id="voice6" preload="auto">
            <source src="../../../../assets/audio/Wanny/Wanny_4_E.mp3" type="audio/mp3">
        </audio>
        <audio id="voice8" preload="auto">
            <source src="../../../../assets/audio/Wanny/Wanny_5_F.mp3" type="audio/mp3">
        </audio>
        <audio id="voice9" preload="auto">
            <source src="../../../../assets/audio/Wanny/Wanny_5_G.mp3" type="audio/mp3">
        </audio>
        <div id="choices" style="display:none;">
            <button id="btnA" class="answer-button"></button>
            <button id="btnB" class="answer-button"></button>
            <button id="btnC" class="answer-button" style="display:none;"></button>
            <button id="btnD" class="answer-button" style="display:none;"></button>
            <button id="btnE" class="answer-button" style="display:none;"></button>
            <button id="btnF" class="answer-button" style="display:none;"></button>
            <button id="btnG" class="answer-button" style="display:none;"></button>
        </div>
        <!-- for actual game do </button>style="display:none;">, but now it is just blocking -->
        <button class="riddle-button"
                id="riddle_btn"
                style="display: none;"
                >
            Continue
        </button>
        <script>
            const person = document.querySelector(".person-container");
            const audioButton = document.getElementById("audioBtn");
            const subtitle = document.getElementById("subtitle");
            const choices = document.getElementById("choices");
            const riddleButton = document.getElementById("riddle_btn");

            const audio1 = document.getElementById("voice1");
            const audio2 = document.getElementById("voice2");
            const audio3B = document.getElementById("voice3");
            const audio3C = document.getElementById("voice4");
            const audio4D = document.getElementById("voice5");
            const audio4E = document.getElementById("voice6");
            const audio4 = document.getElementById("voice7");
            const audio5F = document.getElementById("voice8");
            const audio5G = document.getElementById("voice9");

            const allAudios = [
                audio1,
                audio2,
                audio3B,
                audio3C,
                audio4D,
                audio4E,
                audio4,
                audio5F,
                audio5G
            ];

            const buttons = {
                A: document.getElementById("btnA"),
                B: document.getElementById("btnB"),
                C: document.getElementById("btnC"),
                D: document.getElementById("btnD"),
                E: document.getElementById("btnE"),
                F: document.getElementById("btnF"),
                G: document.getElementById("btnG")
            };

            riddleButton.addEventListener("click", () => {
                window.location.href = nextPage;
            });

            // =====================================================
            // ANSWER TEXT
            // =====================================================

            const answerText = {
                A: "Yes! We need your help. A crew is trapped in the Arctic.",
                B: "Thank you! Goodbye.",
                C: "Thanks a lot! So you have also been on Svalbard?",
                D: "Yes.",
                E: "No.",
                F: "Wow, that sounds impressive. We must continue with the rescue mission.",
                G: "Wow! What about your family? Did they overwinter too?"
            };

            Object.entries(buttons).forEach(([key, button]) => {
                button.textContent = answerText[key];
                button.style.display = "none";
            });

            // =====================================================
            // CONVERSATION STATE
            // =====================================================

            let currentAudio = audio1;
            let conversationStarted = false;

            function hideChoices() {
                choices.style.display = "none";
                Object.values(buttons).forEach(button => {
                    button.style.display = "none";
                });
            }

            function showChoices(...keys) {
                Object.entries(buttons).forEach(([key, button]) => {
                    button.style.display = keys.includes(key)
                        ? "block"
                        : "none";
                });
                choices.style.display = "block";
            }

            function stopOtherAudios(audioToKeep) {
                allAudios.forEach(audio => {
                    if (audio !== audioToKeep) {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                });
            }

            async function playAudio(audio, restart = true) {
                hideChoices();
                stopOtherAudios(audio);
                currentAudio = audio;
                if (restart) {
                    audio.currentTime = 0;
                }
                try {
                    await audio.play();
                    person.classList.add("speaking");
                } catch (error) {
                    person.classList.remove("speaking");
                    subtitle.textContent =
                        "Press the speaker button to continue.";
                    console.warn("Audio playback was blocked:", error);
                }
            }

            function finishConversation() {
                hideChoices();
                subtitle.textContent = "";
                riddleButton.style.display = "block";
            }

            // =====================================================
            // MAIN AUDIO BUTTON
            // =====================================================

            audioButton.addEventListener("click", async () => {
                // First click begins the conversation.
                if (!conversationStarted) {
                    conversationStarted = true;
                    await playAudio(audio1);
                    return;
                }
                if (!currentAudio) {
                    return;
                }
                // Resume the current audio.
                if (currentAudio.paused) {
                    try {
                        await currentAudio.play();
                        person.classList.add("speaking");
                    } catch (error) {
                        console.warn("Audio playback failed:", error);
                    }
                    return;
                }
                // Pause the current audio.
                currentAudio.pause();
                person.classList.remove("speaking");
            });

            // =====================================================
            // ANSWER BUTTONS
            // =====================================================

            buttons.A.addEventListener("click", () => {
                playAudio(audio2);
            });

            buttons.B.addEventListener("click", () => {
                playAudio(audio3B);
            });

            buttons.C.addEventListener("click", () => {
                playAudio(audio3C);
            });

            buttons.D.addEventListener("click", () => {
                playAudio(audio4D);
            });

            buttons.E.addEventListener("click", () => {
                playAudio(audio4E);
            });

            buttons.F.addEventListener("click", () => {
                playAudio(audio5F);
            });

            buttons.G.addEventListener("click", () => {
                playAudio(audio5G);
            });

            // =====================================================
            // CONVERSATION FLOW
            // =====================================================

            const afterAudio = new Map([
                // Audio 1 ends: show the single A button.
                [audio1, () => showChoices("A")],

                // Audio 2 ends: show B and C.
                [audio2, () => showChoices("B", "C")],

                // Audio 3B or 3C ends: show D and E.
                [audio3B, finishConversation],
                [audio3C, () => showChoices("D", "E")],

                // Audio 4D or 4E ends:
                // automatically play the common Audio 4.
                [audio4D, () => playAudio(audio4)],
                [audio4E, () => playAudio(audio4)],

                // Common Audio 4 ends: show F and G.
                [audio4, () => showChoices("F", "G")],

                // Final responses end the conversation.
                [audio5F, finishConversation],
                [audio5G, finishConversation]
            ]);

            allAudios.forEach(audio => {
                audio.addEventListener("play", () => {
                    currentAudio = audio;
                    person.classList.add("speaking");
                });

                audio.addEventListener("pause", () => {
                    if (!audio.ended) {
                        person.classList.remove("speaking");
                    }
                });

                audio.addEventListener("ended", () => {
                    person.classList.remove("speaking");
                    subtitle.textContent = "";

                    const nextAction = afterAudio.get(audio);

                    if (nextAction) {
                        nextAction();
                    }
                });
            });

            // =====================================================
            // SUBTITLE TEXT
            // =====================================================

            const subtitleLines = new Map([
                [audio1, [
                    "Hello?",
                    "This is Wanny Woldstad.",
                    "I can barely hear you through this static.",
                    "Can you hear me?"
                ]],

                [audio2, [
                    "Straight to business, I like that!",
                    "During my years on Svalbard, I learned how important good communication can be.",
                    "Take my notes.",
                    "You will find them in your inventory.",
                    "I think, they might help you to find the right frequency to contact the crew."
                ]],

                [audio3B, [
                    "Goodbye, and good luck.",
                    "And remember: even a weak signal is still a signal."
                ]],

                [audio3C, [
                    "Yes!",
                    "I overwintered there five times, actually.",
                    "Have you been to Svalbard?"
                ]],

                [audio4D, [
                    "Then you know how beautiful it is — But I guess, how harsh it can be."
                ]],

                [audio4E, [
                    "Not yet, hmm?",
                    "More of a beach type?",
                    "*small laugh*"
                ]],

                [audio4, [
                    "But yes, Svalbard is not an easy place.",
                    "Long months of darkness, cold, storms, isolation.",
                    "I was the first female trapper on Svalbard.",
                    "I hunted, trapped, repaired things, kept the hut going, and yes, I shot my first polar bear there.",
                    "That was something I never forgot.",
                    "Before I went on these adventures, I drove a taxi in Tromsø.",
                    "Oh man, I met so many people who were crazy about going to the north.",
                    "Speaking of that, I was actually also the first female taxi driver in the north.",
                    "*laugh*"
                ]],

                [audio5F, [
                    "Selvfølgelig — of course.",
                    "Go on.",
                    "Your crew is waiting.",
                    "Good luck, my friends!"
                ]],

                [audio5G, [
                    "My first husband died early, unfortunately.",
                    "I had two sons, Alf and Bjørvik.",
                    "The first time I overwintered, they stayed on the mainland.",
                    "But later, they came with me to Svalbard and became trappers themselves.",
                    "A family holiday, a little different.",
                    "*laugh*",
                    "I wrote a book about my experiences, if you ever want to read more.",
                    "But now you need to continue your rescue mission.",
                    "Good luck, my friends!"
                ]]
            ]);

            // =====================================================
            // AUTOMATIC SUBTITLE TIMING
            // =====================================================

            const subtitleCues = new Map();

            function subtitleWeight(text) {
                // Remove stage directions such as *laugh*
                // before counting the words.
                const spokenText = text
                    .replace(/\*[^*]+\*/g, "")
                    .trim();

                const wordCount = spokenText
                    ? spokenText.split(/\s+/).length
                    : 2;

                return Math.max(wordCount, 3);
            }
            const subtitleDelays = new Map([
                [audio1, 4.7]
            ]);
            
            function buildSubtitleCues(audio) {
                const lines = subtitleLines.get(audio) || [];
                const duration = audio.duration;

                if (
                    !lines.length ||
                    !Number.isFinite(duration) ||
                    duration <= 0
                ) {
                    return [];
                }

                const subtitleDelay =
                    subtitleDelays.get(audio) || 0;

                const weights = lines.map(subtitleWeight);

                const totalWeight = weights.reduce(
                    (sum, weight) => sum + weight,
                    0
                );

                const availableDuration =
                    Math.max(duration - subtitleDelay, 0);

                let start = subtitleDelay;

                return lines.map((text, index) => {
                    const isLastLine =
                        index === lines.length - 1;

                    const lineDuration =
                        availableDuration *
                        (weights[index] / totalWeight);

                    const end = isLastLine
                        ? duration + 0.05
                        : start + lineDuration;

                    const cue = {
                        start,
                        end,
                        text
                    };

                    start = end;

                    return cue;
                });
            }

            function prepareSubtitles(audio) {
                subtitleCues.set(
                    audio,
                    buildSubtitleCues(audio)
                );
            }

            function updateSubtitle(audio) {
                const cues = subtitleCues.get(audio) || [];
                const currentTime = audio.currentTime;
                const cue = cues.find(item => {
                    return (
                        currentTime >= item.start &&
                        currentTime < item.end
                    );
                });
                subtitle.textContent = cue
                    ? cue.text
                    : "";
            }

            allAudios.forEach(audio => {
                audio.addEventListener("loadedmetadata", () => {
                    prepareSubtitles(audio);
                });

                audio.addEventListener("durationchange", () => {
                    prepareSubtitles(audio);
                });

                audio.addEventListener("timeupdate", () => {
                    updateSubtitle(audio);
                });
            });
        </script>
    </div>
    <game-navigation></game-navigation>
    <script>
        setupGameNavigation();
        loadInventoryScripts().then(() => {
            addWannyProfileToInventory();
        });
    </script>
</body>
</html>
