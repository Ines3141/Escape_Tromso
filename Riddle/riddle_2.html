<!DOCTYPE html>
<html lang="en">

</head>
<body>

        <p>
            Which path do you have to take through the ice?

             alt="Treasure Map"
             class="riddle-map">

        <p id="message"></p>
        <back-button onclick="window.location.href='riddle_1.html'">

    <script>
    function checkAnswer() {
      let answer = document.getElementById("answer").value.toLowerCase();
      if (answer === "3") {
        window.location.href = "../Stations/HTML/station_3.html";
      } /*  else {
         window.location.href = "riddle_1.html";
         Not correct, take another look. Time delay.

    }
    </script>
