<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Riddle Wanny Woldstad </title>
    <link rel="stylesheet" href="../../../../CSS/global.css"> <!-- link to style sheet -->
    <script src="../../../../Stations/JAVA/navigation.js"></script>
</head>

<body>
    <div class="box">
        <h1>Which path did the fox take?</h1>
        <div class="image-container">
            <img src="../../../../assets/images/Labyrinth_Wanny_Animals.jpg" alt="Station 3">
        </div>
        <!-- CHANGE THAT THEY CAN PRESS DIRECTLY THE BUTTONS THERE -->
        <!-- -->
        <input id="answerInput" placeholder="Enter frequency">
        <button id="checkBtn">Transmit</button>
        <p id="feedback"></p>
    </div>

    <script>
        checkBtn.addEventListener("click", () => {
            const answer = answerInput.value
                .toLowerCase()
                .replace(/\s+/g, "");
            if (
                answer === "111" ||
                answer === "111ghz"
            ) {
                window.location.href = "riddle_3_location.html";
            } else {
                feedback.textContent = "Wrong frequency. Try again.";
            }
        });
    </script>
    <game-navigation previous="riddle_3.html" next="riddle_3_location.html">
    </game-navigation>

</body>

</html>
